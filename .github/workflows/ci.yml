# callis-js CI — the source-level gate (plan sections 9/10).
#
#  check: typecheck + lint + full test suite + coverage gates
#  e2e:   the golden demos via the INTERPRETED core (bun run)
#  binary: build the host target, smoke it, and require BYTE-IDENTICAL
#          reports between interpreted and compiled for every demo
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      # No dist/ binary present here: the harness runs the interpreted core.
      - run: bash scripts/e2e.sh

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      # Host target only (the cross-target matrix lives in build.yml).
      - run: bun run build -- --only linux-x64
      - run: bun scripts/binary-smoke.ts
      - run: bun scripts/binary-parity.ts
      # With dist/ present the harness runs the COMPILED binary instead.
      - run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64
          path: |
            dist/callis-linux-x64
            dist/SHA256SUMS
