# callis-js container images (plan section 7): multi-arch ghcr.io images.
#
#  push to main -> :main-<sha7> and :latest
#  tag v*       -> :<tag>
#
# The image carries only the prebuilt binary (models embedded); the mount
# contract is: project at /workspace (the default --project).
name: docker

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      # The image needs only the two linux glibc binaries (not all 8).
      - run: bun run build -- --only linux-x64,linux-arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/callis-js
          tags: |
            {{commit_sha}}=main-{{sha}}
            {{is_default_branch}}=latest
            {{is_tag}}={{tag_name}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
